<!DOCTYPE html>
<html>
<head>
    <title>Cute Login Form</title>

    <style>
        body {
            background-color: #ffd6e7;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login {
            background-color: white;
            width: 300px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px gray;
        }

        h2 {
            color: #ff6699;
        }

        .cute {
            font-size: 30px;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ff99bb;
            border-radius: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #ff6699;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        button:hover {
            background-color: #ff4477;
        }

        p {
            color: #777;
        }

        a {
            color: #ff6699;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login">

        <div class="cute"></div>

        <h2>Welcome Back!</h2>

        <p>Please Login</p>

        <form>

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" placeholder="Enter your password">

            <button type="submit">Login </button>

        </form>

        <p>
            Don't have an account?
            <a href="#">Sign Up</a>
        </p>

    </div>

</body>
</html>
